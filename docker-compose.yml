# Local development database only.
# Production Postgres is the Supabase instance on the Hetzner box.
services:
  postgres:
    image: postgres:17-alpine
    container_name: mediyum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediyum
      POSTGRES_PASSWORD: mediyum
      POSTGRES_DB: mediyum
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mediyum']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
